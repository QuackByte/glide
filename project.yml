name: Glide
options:
  bundleIdPrefix: dev.quackbyte
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 435MC3786D
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "12"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  Glide:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - GlideCoreTests
    sources:
      - path: Sources/Glide
      - path: Assets.xcassets
      # Read by the What's New window.
      - path: CHANGELOG.md
        buildPhase: resources
      # Its translations, CHANGELOG.<code>.md, flat in Resources.
      - path: changelog
        buildPhase: resources
    dependencies:
      - target: GlideCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.quackbyte.glide
        # Sparkle's keys; the rest of Info.plist is generated.
        INFOPLIST_FILE: Sources/Glide/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glide
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 QuackByte. MIT License."
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: YES
  GlideCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/GlideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.quackbyte.glide.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  GlideCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GlideCoreTests
    dependencies:
      - target: GlideCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.quackbyte.glide.core.tests
